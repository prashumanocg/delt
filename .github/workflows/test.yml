# Runs on every push and pull request: unit tests, type check, then the browser tests
# (issue #12) against a production build with fake mail. No secrets needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 can't install browsers on
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Move up with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # Browsers are cached between runs; the system packages WebKit needs come from apt each time.
      # (Installing both from scratch sometimes took most of the old 20-minute limit.)
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}-chromium-webkit
      - name: Install browsers (Chrome and Safari engines)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Install browser system packages
        timeout-minutes: 15
        run: npx playwright install-deps chromium webkit
      - name: Browser tests
        run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # #39: the API routes against a real database. A throwaway Supabase (Postgres + PostgREST) runs
  # in Docker on the runner, supabase/schema.sql is applied twice (it must be safe to re-run), then
  # two students call every route and B must never read or change A's rows. Free, no secrets.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a throwaway Supabase
        # in its own folder, so the CLI doesn't try to run supabase/migrations (schema.sql has them all)
        run: |
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          supabase init
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/sb.env"
      - name: Apply schema.sql twice
        run: |
          for i in 1 2; do psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql; done
      - name: Route isolation tests
        run: |
          set -a; . "$RUNNER_TEMP/sb.env"; set +a
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:db
