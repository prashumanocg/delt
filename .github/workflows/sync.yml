# Background sync for every student (issues #4 and #5), free on GitHub Actions.
# Every ~15 minutes it asks the site to sync whoever is due: students who opened DELT
# this week about every 15 minutes, everyone else once a day. It keeps calling while
# students are left. GitHub may start scheduled runs a few minutes late.
name: Sync mail

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

# Lets the job re-enable itself (see the last step).
permissions:
  actions: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Sync students who are due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: ${{ vars.DELT_SITE || 'https://delt-mu.vercel.app' }} # forks set the DELT_SITE variable to their own address
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::notice::Add the CRON_SECRET repository secret to turn on background sync."; exit 0; fi
          for i in $(seq 1 8); do
            out=$(curl -sS --max-time 150 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/sync") || { echo "request failed"; exit 1; }
            synced=$(echo "$out" | jq -r '.synced // 0')
            remaining=$(echo "$out" | jq -r '.remaining // 0')
            reminders=$(echo "$out" | jq -r '.reminders // 0')
            echo "round $i: synced $synced, $remaining left, $reminders reminders"
            if echo "$out" | jq -e '.error' > /dev/null; then echo "$out"; exit 1; fi
            [ "$remaining" -eq 0 ] && break
          done

      # #40: say loudly when background sync is falling behind or students have problems
      - name: Check sync health
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: ${{ vars.DELT_SITE || 'https://delt-mu.vercel.app' }} # forks set the DELT_SITE variable to their own address
        run: |
          [ -z "$CRON_SECRET" ] && exit 0
          h=$(curl -sS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/health") || { echo "::warning::Health check failed"; exit 0; }
          echo "health: $h"
          behind=$(echo "$h" | jq -r '.oldestActiveMinutes // 0')
          problems=$(echo "$h" | jq -r '.withProblems // 0')
          [ "$behind" -gt 120 ] && echo "::warning::Background sync is $behind minutes behind for active students"
          [ "$problems" -gt 0 ] && echo "::warning::$problems students had a problem on their last sync"
          exit 0

      # GitHub switches off scheduled workflows after 60 days with no commits. Re-enabling the
      # workflow resets that clock, so background sync and notifications never stop silently (#36, #37).
      - name: Keep this schedule alive
        if: always() && github.event_name == 'schedule' # even if a sync round failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d%H%M | cut -c1-4)" = "0100" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" && echo "Schedule kept alive"
          fi
