<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="3 screen sizes tested · 14 mail apps studied · 3000 random mails, no crash · 0 rupees to run">
<style>
  .bg { fill: #fafaf9; } .ink { fill: #1c1917; } .rule { stroke: #1c1917; } .red { fill: #c8102e; } .redline { stroke: #c8102e; }
  .inv { fill: #fafaf9; } .invs { stroke: #fafaf9; }
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .l { font-weight: 300; } .r { font-weight: 400; } .m { font-weight: 500; } .h { font-weight: 800; }
  .caps { font-weight: 500; letter-spacing: .12em; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161412; } .ink { fill: #f5f4f2; } .rule { stroke: #f5f4f2; } .inv { fill: #161412; } .invs { stroke: #161412; }
    .red { fill: #ff4d5e; } .redline { stroke: #ff4d5e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .c0 { opacity: 0; animation: c0 7s cubic-bezier(.22,1,.36,1) infinite; } @keyframes c0 { 0%, 0% { opacity: 0; transform: translateY(12px); } 10%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .c1 { opacity: 0; animation: c1 7s cubic-bezier(.22,1,.36,1) infinite; } @keyframes c1 { 0%, 6% { opacity: 0; transform: translateY(12px); } 16%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .c2 { opacity: 0; animation: c2 7s cubic-bezier(.22,1,.36,1) infinite; } @keyframes c2 { 0%, 12% { opacity: 0; transform: translateY(12px); } 22%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .c3 { opacity: 0; animation: c3 7s cubic-bezier(.22,1,.36,1) infinite; } @keyframes c3 { 0%, 18% { opacity: 0; transform: translateY(12px); } 28%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }</style>
<rect width="1200" height="190" class="bg"/>
<g class="c0">
      <rect x="72" y="40" width="40" height="2" class="red" fill-opacity="1"/>
      <text x="68" y="122" class="ink l num" font-size="72" letter-spacing="-3">3</text>
      <text x="72" y="154" class="ink caps" font-size="12" fill-opacity=".5">SCREEN SIZES TESTED</text>
    </g><g class="c1">
      <rect x="342" y="40" width="230" height="2" class="ink" fill-opacity="0.15"/>
      <text x="338" y="122" class="ink l num" font-size="72" letter-spacing="-3">14</text>
      <text x="342" y="154" class="ink caps" font-size="12" fill-opacity=".5">MAIL APPS STUDIED</text>
    </g><g class="c2">
      <rect x="612" y="40" width="230" height="2" class="ink" fill-opacity="0.15"/>
      <text x="608" y="122" class="ink l num" font-size="72" letter-spacing="-3">3000</text>
      <text x="612" y="154" class="ink caps" font-size="12" fill-opacity=".5">RANDOM MAILS, NO CRASH</text>
    </g><g class="c3">
      <rect x="882" y="40" width="230" height="2" class="ink" fill-opacity="0.15"/>
      <text x="878" y="122" class="ink l num" font-size="72" letter-spacing="-3">0</text>
      <text x="882" y="154" class="ink caps" font-size="12" fill-opacity=".5">RUPEES TO RUN</text>
    </g>
</svg>
